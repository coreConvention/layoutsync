# Release
#
# Publishes a portable, framework-dependent LayoutSync CLI artifact on tag push
# (v*), so downstream CI — e.g. coreConvention/w31rd's layout-sync workflows —
# can download a pinned version instead of building from source every run.
#
# Consumers invoke `dotnet LayoutSync.dll ...` through the shared .NET host, so a
# portable framework-dependent publish (no -r, --self-contained false is the
# default) is sufficient and cross-platform; the consumer keeps its own
# actions/setup-dotnet to provide the .NET 10 runtime.
#
# Only the CLI ships — LayoutSync.Mcp is a local-developer tool with no CI consumer.
#
# Issue: #10
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        # v1.2.3 -> 1.2.3 (strip the leading v for -p:Version)
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        # Gate the release: never publish a binary that downstream CI will pin.
        # No -warnaserror — main carries a known pre-existing SYSLIB0057 cert-API warning.
        run: dotnet test LayoutSync.sln -c Release

      - name: Publish (portable, framework-dependent, CLI only)
        run: |
          dotnet publish LayoutSync/LayoutSync.csproj \
            -c Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/layoutsync

      - name: Package
        # Flat tarball (contents at the archive root) so a consumer can extract
        # LayoutSync.dll directly into its target directory.
        run: tar -czf "layoutsync-${{ steps.ver.outputs.version }}.tar.gz" -C publish/layoutsync .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "layoutsync-${{ steps.ver.outputs.version }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LayoutSync $GITHUB_REF_NAME" \
            --generate-notes
